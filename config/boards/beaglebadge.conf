# BeagleBadge Texas Instruments AM62L dual core 128MB 2xGBE OSPI HDMI

BOARD_NAME="BeagleBadge"
BOARDFAMILY="k3"
BOARD_MAINTAINER="Grippy98"
BOOT_SOC="am62l"
BOOTCONFIG="am62lx_badge_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="ti/k3-am62l3-badge.dts"
TIBOOT3_FILE="tiboot3.bin"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="vendor,vendor-rt,vendor-edge"
KERNEL_TEST_TARGET="vendor"
SERIALCON="ttyS2"
ATF_BOARD="am62l-badge"
EXTRA_ATF_TARGETS="build/k3/am62l-badge/release/bl1.bin:bl1.bin"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62lx"
EXTRA_BOOT_ARGS="BL1=bl1.bin"
DISPLAY_SUPPORT="yes"
CC33XX_SUPPORT="yes"

function post_family_config__beaglebadge_add_ti_packages() {
    display_alert "$BOARD" "Adding TI Bluetooth packages" "info"
    TI_PACKAGES+=("bluetooth" "bluez-tools")
}

# ============================================================================
# LOW-RAM OPTIMIZATIONS FOR 128MB BADGE
# Using post_customize_image__ hooks which run AFTER install_distribution_agnostic()
# This prevents conflicts with Armbian's standard service enabling
# ============================================================================

function post_family_tweaks__beaglebadge_purge_packages() {
	display_alert "$BOARD" "Purging packages" "info"

	chroot "${SDCARD}" /bin/bash -c "apt-get purge -y \
		weston \
		seatd \
		ti-lvgl-demo \
		firmware-cnm-wave \
		libweston-14-0 \
		libegl-mesa0 \
		libglapi-mesa \
		libgbm1 \
		libvulkan1 \
		groff-base \
		alsa-utils \
		libpulse0 \
		libpipewire-0.3-0t64 \
		libspa-0.2-modules \
		libavcodec61 \
		libavformat61 \
		libavfilter10 \
		|| true
	"

	chroot "${SDCARD}" /bin/bash -c "
		apt-get autoremove -y || true
		apt-get clean || true
	"
}

function post_customize_image__zz_beaglebadge_10_disable_apt_periodic() {
	display_alert "$BOARD" "Disabling APT periodic services (post-config)" "info"

	# Disable and mask APT timers; timers are what trigger the services
	chroot "${SDCARD}" /bin/bash -c "
		systemctl disable apt-daily.timer apt-daily-upgrade.timer || true
		systemctl mask apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service || true
	"

	# Remove timer files
	rm -f "${SDCARD}"/lib/systemd/system/apt-daily.timer
	rm -f "${SDCARD}"/lib/systemd/system/apt-daily-upgrade.timer
	rm -f "${SDCARD}"/etc/systemd/system/timers.target.wants/apt-daily.timer
	rm -f "${SDCARD}"/etc/systemd/system/timers.target.wants/apt-daily-upgrade.timer

	# Override APT periodic config
	cat <<-EOF > "${SDCARD}"/etc/apt/apt.conf.d/02-armbian-periodic
	// Disabled for 128MB RAM optimization
	APT::Periodic::Enable "0";
	APT::Periodic::Update-Package-Lists "0";
	APT::Periodic::Download-Upgradeable-Packages "0";
	APT::Periodic::Unattended-Upgrade "0";
	APT::Periodic::AutocleanInterval "0";
	EOF

	# Add low-RAM APT settings
	cat <<-EOF > "${SDCARD}"/etc/apt/apt.conf.d/99-lowram
	// Reduce APT memory usage
	// APT::Cache-Limit "8388608";
	// APT::Cache-Start "8388608";
	// APT::Cache-Grow "1048576";
	Dir::Cache::Archives::MaxAge "0";
	Dir::Cache::Archives::MaxSize "50M";
	APT::AutoRemove::RecommendsImportant "0";
	APT::AutoRemove::SuggestsImportant "0";
	EOF
}

function post_customize_image__zz_beaglebadge_20_disable_locale_gen() {
	display_alert "$BOARD" "Disabling locale generation on first boot" "info"

	chroot "${SDCARD}" /bin/bash -c "
		systemctl disable armbian-firstrun.service || true
		locale-gen en_US.UTF-8 || true
	"

	cat <<-EOF > "${SDCARD}"/etc/default/locale
	LANG=en_US.UTF-8
	LC_ALL=en_US.UTF-8
	EOF

	if [ -f "${SDCARD}"/etc/locale.gen ]; then
		sed -i 's/^[^#]/#&/' "${SDCARD}"/etc/locale.gen
		echo "en_US.UTF-8 UTF-8" >> "${SDCARD}"/etc/locale.gen
	fi
}

function post_customize_image__zz_beaglebadge_30_trim_systemd() {
	display_alert "$BOARD" "Trimming systemd services (post-config)" "info"

	# Services to disable (not mask - let them exist but not start)
	local services_to_disable=(
		"systemd-timesyncd.service"
		"keyboard-setup.service"
		"console-setup.service"
		"rsyslog.service"
		"bluetooth.service"
		"alsa-restore.service"
		"alsa-state.service"
		"systemd-homed.service"
		"systemd-homed-activate.service"
		"cron.service"
		"armbian-hardware-monitor.service"
		"armbian-hardware-optimize.service"
	)

	for service in "${services_to_disable[@]}"; do
		chroot "${SDCARD}" /bin/bash -c "systemctl disable ${service} || true"
	done

	# Timers to mask (these are safe and won't conflict)
	local timers_to_mask=(
		"man-db.timer"
		"fstrim.timer"
		"logrotate.timer"
		"dpkg-db-backup.timer"
		"e2scrub_all.timer"
		"fake-hwclock-save.timer"
		"systemd-tmpfiles-clean.timer"
	)

	for timer in "${timers_to_mask[@]}"; do
		chroot "${SDCARD}" /bin/bash -c "systemctl mask ${timer} || true"
		local service="${timer%.timer}.service"
		chroot "${SDCARD}" /bin/bash -c "systemctl mask ${service} || true"
	done
}

function post_customize_image__zz_beaglebadge_40_limit_journal() {
	display_alert "$BOARD" "Limiting systemd journal size" "info"

	mkdir -p "${SDCARD}"/etc/systemd/journald.conf.d/
	cat <<-EOF > "${SDCARD}"/etc/systemd/journald.conf.d/00-journal-size.conf
	[Journal]
	SystemMaxUse=16M
	SystemMaxFileSize=4M
	RuntimeMaxUse=8M
	RuntimeMaxFileSize=2M
	MaxRetentionSec=1day
	ForwardToSyslog=no
	ForwardToKMsg=no
	ForwardToConsole=no
	ForwardToWall=no
	MaxLevelStore=warning
	MaxLevelSyslog=warning
	Compress=yes
	EOF
}

function post_customize_image__zz_beaglebadge_50_optimize_systemd_timeouts() {
	display_alert "$BOARD" "Optimizing systemd timeouts" "info"

	mkdir -p "${SDCARD}"/etc/systemd/system.conf.d/
	cat <<-EOF > "${SDCARD}"/etc/systemd/system.conf.d/99-lowram.conf
	[Manager]
	DefaultTimeoutStartSec=30s
	DefaultTimeoutStopSec=15s
	DefaultTimeoutAbortSec=15s
	DefaultDeviceTimeoutSec=30s
	# Reduce default memory limits
	DefaultLimitNOFILE=1024:4096
	DefaultLimitNPROC=256:512
	EOF

	mkdir -p "${SDCARD}"/etc/systemd/coredump.conf.d/
	cat <<-EOF > "${SDCARD}"/etc/systemd/coredump.conf.d/disable.conf
	[Coredump]
	Storage=none
	ProcessSizeMax=0
	EOF
}

function post_customize_image__zz_beaglebadge_60_kernel_params() {
	display_alert "$BOARD" "Setting low-RAM kernel parameters" "info"

	cat <<-EOF > "${SDCARD}"/etc/sysctl.d/99-lowram.conf
	# Memory management for 128MB system
	vm.swappiness=10
	vm.vfs_cache_pressure=150
	vm.dirty_background_ratio=5
	vm.dirty_ratio=10
	vm.min_free_kbytes=2048
	vm.overcommit_memory=1
	vm.overcommit_ratio=80

	# Reduce kernel verbosity
	kernel.printk=3 4 1 3

	# Minimize network buffers
	net.core.rmem_max=262144
	net.core.wmem_max=262144
	net.ipv4.tcp_rmem=4096 65536 262144
	net.ipv4.tcp_wmem=4096 16384 262144
	net.core.netdev_max_backlog=1000

	# Reduce inotify limits
	fs.inotify.max_user_watches=8192
	fs.inotify.max_user_instances=128
	EOF
}

function post_customize_image__zz_beaglebadge_70_minimize_logs() {
	display_alert "$BOARD" "Minimizing log rotation" "info"

	cat <<-EOF > "${SDCARD}"/etc/logrotate.d/00-minimal
	/var/log/alternatives.log
	/var/log/dpkg.log
	/var/log/apt/*.log
	{
		rotate 1
		size 1M
		missingok
		notifempty
		compress
		delaycompress
	}
	EOF
}

function post_customize_image__zzz_beaglebadge_99_cleanup() {
	display_alert "$BOARD" "Final cleanup for minimal image" "info"

	# Remove unnecessary cached files
	rm -rf "${SDCARD}"/var/cache/apt/archives/*.deb
	rm -rf "${SDCARD}"/var/cache/apt/pkgcache.bin
	rm -rf "${SDCARD}"/var/cache/apt/srcpkgcache.bin
	rm -rf "${SDCARD}"/var/lib/apt/lists/*
	rm -rf "${SDCARD}"/usr/share/doc/*
	rm -rf "${SDCARD}"/usr/share/man/*
	rm -rf "${SDCARD}"/usr/share/info/*

	# Remove locales except en_US
	find "${SDCARD}"/usr/share/locale -mindepth 1 -maxdepth 1 ! -name 'en_US' -type d -exec rm -rf {} + || true

	# Regenerate font cache with minimal fonts
	chroot "${SDCARD}" /bin/bash -c "fc-cache -f || true"

	display_alert "$BOARD" "128MB optimization complete" "info"
}
