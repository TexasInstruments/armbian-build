# BeagleBadge Texas Instruments AM62L dual core 128MB 2xGBE OSPI HDMI

BOARD_NAME="BeagleBadge"
BOARDFAMILY="k3"
BOARD_MAINTAINER="Grippy98"
BOOT_SOC="am62l"
BOOTCONFIG="am62lx_badge_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="ti/k3-am62l3-badge.dts"
TIBOOT3_FILE="tiboot3.bin"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="vendor,vendor-rt,vendor-edge"
KERNEL_TEST_TARGET="vendor"
SERIALCON="ttyS2"
ATF_BOARD="am62l-badge"
EXTRA_ATF_TARGETS="build/k3/am62l-badge/release/bl1.bin:bl1.bin"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62lx"
EXTRA_BOOT_ARGS="BL1=bl1.bin"
DISPLAY_SUPPORT="yes"
CC33XX_SUPPORT="yes"

function post_family_tweaks__beaglebadge_purge_packages() {
	display_alert "$BOARD" "Purging packages" "info"

	chroot $SDCARD /bin/bash -c "apt-get purge -y \
		weston \
		seatd \
		ti-lvgl-demo \
		firmware-cnm-wave \
		libweston-14-0 \
		libegl-mesa0 \
		libglapi-mesa \
		libgbm1 \
		libvulkan1 \
		groff-base \
		alsa-utils \
		libpulse0 \
		libpipewire-0.3-0t64 \
		libspa-0.2-modules \
		libavcodec61 \
		libavformat61 \
		libavfilter10"

	chroot $SDCARD /bin/bash -c "apt-get autoremove -y && apt-get clean"
}

function post_family_tweaks__beaglebadge_trim_apt() {
	display_alert "$BOARD" "Disabling APT periodic services" "info"

	# IMPORTANT: Disable the TIMERS, not just the services
	# Timers are what trigger the services
	chroot $SDCARD /bin/bash -c "systemctl disable apt-daily.timer"
	chroot $SDCARD /bin/bash -c "systemctl disable apt-daily-upgrade.timer"

	# Mask both timers and services to prevent any activation
	chroot $SDCARD /bin/bash -c "systemctl mask apt-daily.timer"
	chroot $SDCARD /bin/bash -c "systemctl mask apt-daily-upgrade.timer"
	chroot $SDCARD /bin/bash -c "systemctl mask apt-daily.service"
	chroot $SDCARD /bin/bash -c "systemctl mask apt-daily-upgrade.service"

	# Remove timer files physically
	chroot $SDCARD /bin/bash -c "rm -f /lib/systemd/system/apt-daily.timer"
	chroot $SDCARD /bin/bash -c "rm -f /lib/systemd/system/apt-daily-upgrade.timer"
	chroot $SDCARD /bin/bash -c "rm -f /etc/systemd/system/timers.target.wants/apt-daily.timer"
	chroot $SDCARD /bin/bash -c "rm -f /etc/systemd/system/timers.target.wants/apt-daily-upgrade.timer"

	# Override Armbian's periodic config (prevents apt from running updates)
	cat <<-EOF > "${SDCARD}"/etc/apt/apt.conf.d/02-armbian-periodic
	// Disabled for 128MB RAM optimization
	APT::Periodic::Enable "0";
	APT::Periodic::Update-Package-Lists "0";
	APT::Periodic::Download-Upgradeable-Packages "0";
	APT::Periodic::Unattended-Upgrade "0";
	APT::Periodic::AutocleanInterval "0";
	EOF

	# Add low-RAM specific APT settings
	cat <<-EOF > "${SDCARD}"/etc/apt/apt.conf.d/99-lowram
	// Reduce APT memory usage
	APT::Cache-Limit "8388608";
	APT::Cache-Start "8388608";
	APT::Cache-Grow "1048576";

	// Limit cache size
	Dir::Cache::Archives::MaxAge "0";
	Dir::Cache::Archives::MaxSize "50M";

	// Don't keep unnecessary packages
	APT::AutoRemove::RecommendsImportant "0";
	APT::AutoRemove::SuggestsImportant "0";

	// Reduce dpkg memory
	DPkg::Pre-Install-Pkgs::MaxSize "50M";
	EOF
}

function post_family_tweaks__beaglebadge_disable_locale_gen() {
	display_alert "$BOARD" "Disabling locale generation on first boot" "info"

	chroot $SDCARD /bin/bash -c "systemctl disable armbian-firstrun.service" 2>/dev/null || true
	chroot $SDCARD /bin/bash -c "systemctl mask armbian-firstrun.service" 2>/dev/null || true
	chroot $SDCARD /bin/bash -c "locale-gen en_US.UTF-8" 2>/dev/null || true

	cat <<-EOF > "${SDCARD}"/etc/default/locale
	LANG=en_US.UTF-8
	LC_ALL=en_US.UTF-8
	EOF

	if [ -f "${SDCARD}"/etc/locale.gen ]; then
		sed -i 's/^[^#]/#&/' "${SDCARD}"/etc/locale.gen
		echo "en_US.UTF-8 UTF-8" >> "${SDCARD}"/etc/locale.gen
	fi
}

function post_family_tweaks__beaglebadge_trim_systemd() {
	display_alert "$BOARD" "Trimming systemd services" "info"

	local services_to_disable=(
		"systemd-timesyncd.service"
		"keyboard-setup.service"
		"console-setup.service"
		"rsyslog.service"
		"bluetooth.service"
		"alsa-restore.service"
		"alsa-state.service"
		"systemd-homed.service"
		"systemd-homed-activate.service"
		"cron.service"
		"armbian-hardware-monitor.service"
		"armbian-hardware-optimize.service"
		"armbian-resize-filesystem.service"
	)

	for service in "${services_to_disable[@]}"; do
		chroot $SDCARD /bin/bash -c "systemctl disable $service" 2>/dev/null || true
	done

	local timers_to_disable=(
		"man-db.timer"
		"fstrim.timer"
		"logrotate.timer"
		"dpkg-db-backup.timer"
		"e2scrub_all.timer"
		"fake-hwclock-save.timer"
		"systemd-tmpfiles-clean.timer"
	)

	for timer in "${timers_to_disable[@]}"; do
		chroot $SDCARD /bin/bash -c "systemctl mask $timer" 2>/dev/null || true
		local service="${timer%.timer}.service"
		chroot $SDCARD /bin/bash -c "systemctl mask $service" 2>/dev/null || true
	done
}

function post_family_tweaks__beaglebadge_limit_journal() {
	display_alert "$BOARD" "Limiting systemd journal size" "info"

	mkdir -p "${SDCARD}"/etc/systemd/journald.conf.d/
	cat <<-EOF > "${SDCARD}"/etc/systemd/journald.conf.d/00-journal-size.conf
	[Journal]
	SystemMaxUse=16M
	SystemMaxFileSize=4M
	RuntimeMaxUse=8M
	RuntimeMaxFileSize=2M
	MaxRetentionSec=1day
	ForwardToSyslog=no
	ForwardToKMsg=no
	ForwardToConsole=no
	ForwardToWall=no
	MaxLevelStore=warning
	MaxLevelSyslog=warning
	EOF
}

function post_family_tweaks__beaglebadge_optimize_systemd_timeouts() {
	display_alert "$BOARD" "Optimizing systemd timeouts" "info"

	mkdir -p "${SDCARD}"/etc/systemd/system.conf.d/
	cat <<-EOF > "${SDCARD}"/etc/systemd/system.conf.d/timeouts.conf
	[Manager]
	DefaultTimeoutStartSec=30s
	DefaultTimeoutStopSec=15s
	DefaultTimeoutAbortSec=15s
	DefaultDeviceTimeoutSec=30s
	EOF

	mkdir -p "${SDCARD}"/etc/systemd/coredump.conf.d/
	cat <<-EOF > "${SDCARD}"/etc/systemd/coredump.conf.d/disable.conf
	[Coredump]
	Storage=none
	ProcessSizeMax=0
	EOF
}

function post_family_tweaks__beaglebadge_kernel_params() {
	display_alert "$BOARD" "Setting low-RAM kernel parameters" "info"

	cat <<-EOF > "${SDCARD}"/etc/sysctl.d/99-lowram.conf
	vm.swappiness=10
	vm.vfs_cache_pressure=150
	vm.dirty_background_ratio=5
	vm.dirty_ratio=10
	vm.min_free_kbytes=2048
	vm.overcommit_memory=1
	kernel.printk=3 4 1 3
	net.core.rmem_max=262144
	net.core.wmem_max=262144
	net.ipv4.tcp_rmem=4096 87380 262144
	net.ipv4.tcp_wmem=4096 16384 262144
	fs.inotify.max_user_watches=8192
	fs.inotify.max_user_instances=128
	EOF
}

function post_family_tweaks__beaglebadge_minimize_logs() {
	display_alert "$BOARD" "Minimizing log rotation" "info"

	cat <<-EOF > "${SDCARD}"/etc/logrotate.d/00-minimal
	/var/log/alternatives.log
	/var/log/dpkg.log
	/var/log/apt/*.log
	{
		rotate 1
		size 1M
		missingok
		notifempty
		compress
		delaycompress
	}
	EOF
}
