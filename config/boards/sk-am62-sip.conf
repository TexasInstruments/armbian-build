# Texas Instruments AM62SIP quad core 2xGBE OSPI HDMI

BOARD_NAME="SK-AM62-SIP"
BOARDFAMILY="k3"
BOARD_MAINTAINER="sadik-smd"
BOOTCONFIG="am6254xxl_evm_a53_defconfig"
BOOTFS_TYPE="fat"
BOOT_FDT_FILE="ti/k3-am6254xxl-sk.dts"
TIBOOT3_BOOTCONFIG="am6254xxl_evm_r5_defconfig"
TIBOOT3_FILE="tiboot3-am62x-hs-fs-evm.bin"
TISPL_FILE="tispl.bin_unsigned"
UBOOT_FILE="u-boot.img_unsigned"
DEFAULT_CONSOLE="serial"
KERNEL_TARGET="current,current-rt,edge"
KERNEL_TEST_TARGET="current,current-rt"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1 CFG_TZDRAM_START=0x80080000"
OPTEE_PLATFORM="k3-am62x"
SERIALCON="ttyS2"
ATF_BOARD="lite"
ATF_EXTRA_ARGS="BL32_BASE=0x80080000 PRELOADED_BL33_BASE=0x82000000"
GPU_SUPPORT="yes"
SOC_ID="am62"
DISPLAY_SUPPORT="yes"
