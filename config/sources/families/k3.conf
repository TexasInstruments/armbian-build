declare -g ARCH="arm64"
declare -g LINUXFAMILY="k3"
declare -g OVERLAY_DIR="/boot/dtb/ti/overlay"

declare -g KERNELSOURCE="https://github.com/TexasInstruments/ti-linux-kernel"

if [[ "${BOARD_NAME}" != "am62lxx-evm" ]]; then
	declare -g ATFSOURCE="https://github.com/ARM-software/arm-trusted-firmware"
else
	declare -g ATFSOURCE="https://github.com/TexasInstruments/arm-trusted-firmware"
fi

declare -g BOOTSOURCE="https://github.com/TexasInstruments/ti-u-boot"

declare -g BOOTSCRIPT="boot-k3.cmd:uEnv.txt"

declare -g INSTALL_HEADERS="yes"

declare -g TI_PACKAGES=("vim" "network-manager")
if [[ "${CC33XX_SUPPORT}" == "yes" ]] ; then
	if [[ "${RELEASE}" == "trixie" || "${RELEASE}" == "noble" ]] ; then
		TI_PACKAGES+=("cc33xx-fw" "cc33conf" "cc33calibrator")
	fi
fi

if [[ "${GPU_SUPPORT}" == "yes" ]] ; then
	TI_PACKAGES+=("ti-img-rogue-driver-${SOC_ID}-dkms" "ti-img-rogue-umlibs-${SOC_ID}" "ti-img-rogue-tools-${SOC_ID}" "ti-img-rogue-firmware-${SOC_ID}")
	TI_PACKAGES+=("mesa-vulkan-drivers" "libgl1-mesa-dri")
    TI_PACKAGES+=("gstreamer1.0-tools" "gstreamer1.0-plugins-good" "gstreamer1.0-plugins-bad" "gstreamer1.0-plugins-base")

	if [[ "${CHROMIUM_SUPPORT}" == "yes" ]] ; then
		TI_PACKAGES+=("chromium")
	fi
fi

if [[ "${DISPLAY_SUPPORT}" == "yes" ]] ; then
    TI_PACKAGES+=("weston" "seatd")
fi

if [[ "${BOARD_NAME}" != "am62lxx-evm" ]]; then
	TI_PACKAGES+=("k3conf")
else
	TI_PACKAGES+=("ti-lvgl-demo")
fi

TI_PACKAGES+=("firmware-cnm-wave" "firmware-ti-ipc-${SOC_ID}" "firmware-ti-connectivity")

if [[ ! -z ${EXTRA_BOARD_PACKAGES} ]] ; then
	TI_PACKAGES+=("${EXTRA_BOARD_PACKAGES[@]}")
fi

enable_extension "ti-debpkgs"
enable_extension "apa"

case "${BRANCH}" in

	current | current-rt)

		declare -g CORESDK_TAG="tag:11.01.16"
		declare -g KERNEL_MAJOR_MINOR="6.12"
		declare -g KERNELBRANCH="${CORESDK_TAG}"
		declare -g KERNEL_DESCRIPTION="Texas Instruments currently supported SDK (vendor) kernel"

		if [[ "${BOARD_NAME}" != "am62lxx-evm" ]]; then
			declare -g ATFBRANCH="commit:e0c4d3903b382bf34f552af53e6d955fae5283ab"
		else
			declare -g ATFBRANCH="commit:6c8ef67293770a59afe86f8e98cfa39d01614ab8"
		fi

		declare -g OPTEE_BRANCH="commit:a9690ae39995af36a31b7a4f446f27ea0787e3a4"
		declare -g TI_LINUX_FIRMWARE_BRANCH="${CORESDK_TAG}"
		declare -g BOOTBRANCH="${CORESDK_TAG}"
		EXTRAWIFI="no"
		;;

	edge)

		declare -g CORESDK_TAG="tag:11.00.12"
		declare -g KERNEL_MAJOR_MINOR="6.12"
		declare -g KERNELBRANCH="${CORESDK_TAG}"
		declare -g ATFBRANCH="commit:b45324936bbba464b0623c83cd5aa53e1cd4cbdb"
		declare -g OPTEE_BRANCH="tag:4.6.0"
		declare -g TI_LINUX_FIRMWARE_BRANCH="${CORESDK_TAG}"
		declare -g BOOTBRANCH="${CORESDK_TAG}"
		EXTRAWIFI="no"
		declare -g KERNEL_DESCRIPTION="Edge branch of TI Linux SDK"
		;;

esac

ATF_PLAT="k3"
ATF_TARGET_MAP="PLAT=${ATF_PLAT} TARGET_BOARD=${ATF_BOARD} SPD=opteed ${ATF_K3_USART_OFFSET} ${ATF_EXTRA_ARGS[@]} all;;build/${ATF_PLAT}/${ATF_BOARD}/release/bl31.bin:bl31.bin ${EXTRA_ATF_TARGETS}"

UBOOT_TARGET_MAP="BL31=bl31.bin ${EXTRA_BOOT_ARGS} TEE=${SRC}/cache/sources/optee-os/out/arm-plat-k3/core/tee-pager_v2.bin BINMAN_INDIRS=${SRC}/cache/sources/ti-linux-firmware all;;${TIBOOT3_OUT_PATH}${TIBOOT3_FILE}:tiboot3.bin ${TISPL_FILE}:tispl.bin ${UBOOT_FILE}:u-boot.img"

# To match what our current SDK produces
BOOT_FS_LABEL="boot"
ROOT_FS_LABEL="root"

function add_host_dependencies__k3_python3_dep() {
	display_alert "Preparing K3 U-Boot host-side dependencies" "${EXTENSION}" "info"
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} python3-yaml python3-jsonschema yamllint python3-cryptography python3-pyelftools python3-setuptools"
}

function compile_k3_bootgen() {
	# Source code checkout
	(fetch_from_repo "https://github.com/TexasInstruments/ti-linux-firmware" "ti-linux-firmware" ${TI_LINUX_FIRMWARE_BRANCH})

	if [[ "${BOARD_NAME}" != "am62lxx-evm" ]]; then
		pushd ${SRC}/cache/sources/u-boot-worktree/u-boot/${BOOTBRANCH##*:} || exit
		run_host_command_logged make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- ${TIBOOT3_BOOTCONFIG} O=${TIBOOT3_OUT_PATH}
		run_host_command_logged make -j$(nproc) ARCH=arm CROSS_COMPILE=arm-linux-gnueabi- O=${TIBOOT3_OUT_PATH} BINMAN_INDIRS=${SRC}/cache/sources/ti-linux-firmware
		popd
	fi

}

function compile_k3_optee() {
	(fetch_from_repo "https://github.com/OP-TEE/optee_os" "optee-os" ${OPTEE_BRANCH})
	pushd ${SRC}/cache/sources/optee-os || exit
	run_host_command_logged make -j$(nproc) CROSS_COMPILE=arm-linux-gnueabihf- CROSS_COMPILE64=aarch64-linux-gnu- PLATFORM=${OPTEE_PLATFORM} CFG_ARM64_core=y ${OPTEE_ARGS}
	popd
}

function pre_config_uboot_target__build_first_stage() {
	# Compile first stage bootloader
	compile_k3_optee
	compile_k3_bootgen
}

function pre_prepare_partitions() {
	# Filesystem must fill partition regardless of alignment
	mkopts[fat]='-a'
}

function post_create_partitions() {
	display_alert "Setting boot partition flags on" "${SDCARD}.raw" "debug"

	# ROM is very particular about boot flags
	run_host_command_logged parted "${SDCARD}".raw set 1 boot on
	run_host_command_logged parted "${SDCARD}".raw set 1 bls_boot off
}

function format_partitions() {
	# ROM is very particular about partition IDs
	run_host_command_logged sfdisk --part-type ${LOOP} 1 e
}

function write_uboot_platform() {
	cp $1/tiboot3.bin ${MOUNT}/boot
	cp $1/sysfw.itb ${MOUNT}/boot || true
	cp $1/tispl.bin ${MOUNT}/boot
	cp $1/u-boot.img ${MOUNT}/boot
}
